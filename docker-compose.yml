services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: followup
      POSTGRES_PASSWORD: followup
      POSTGRES_DB: followup
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U followup -d followup"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://followup:followup@postgres:5432/followup
      JWT_SECRET: mch-followup-dev-secret
      PORT: "3000"
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
  web:
    build: ./apps/web
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  pgdata:
